[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clavus"
version = "0.1.0-beta"
description = "Snapshot, sync, and collaborate on Ableton Live projects"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "castle-queenside", email = "slow_hands@icloud.com"},
]
urls = {Homepage = "https://github.com/castle-queenside/clavus"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
dependencies = [
    # httpx: required for Tailscale Unix Domain Socket transport (no stdlib alternative).
    # All other HTTP calls use stdlib urllib (see clavus/http_client.py).
    "httpx",
    "textual",
    "zeroconf",
    "fastapi",
    "uvicorn",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pyright>=1.1",
    "pre-commit>=3",
]

[tool.pyright]
include = ["clavus", "tests"]
exclude = ["**/__pycache__", "tests/fixtures"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
pythonPlatform = "Darwin"

[tool.pre-commit]
# Run manually: pre-commit run --all-files
# Install: pre-commit install


[tool.setuptools.packages.find]
include = ["clavus*"]

[project.scripts]
clavus = "clavus.cli:main"
