name: CI

on:
  push:
    branches: [main, feature/*]
    paths-ignore:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Generate test fixture
      run: python3 fixtures/gen_fixture.py

    - name: Run tests
      # The tests live in tests/ — pytest.ini points there too. The
      # `|| true` that used to end this step made the job green
      # whatever pytest said, so a failing suite was reported as a
      # passing build.
      run: python3 -m pytest tests/ -v
