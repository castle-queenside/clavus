name: Rust CI

on:
  push:
    branches: [rust]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [rust]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rust

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'rust -> rust'

      - name: Generate test fixture
        run: python3 fixtures/gen_fixture.py

      - name: Test
        run: cargo test --all
        working-directory: rust

      - name: Check
        run: cargo check --all-targets
        working-directory: rust

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust

      - name: Build the Linux targets
        # The studio machine runs Linux, so both musl targets are built
        # here to catch a compile error before a release, not after.
        # The musl targets link themselves (rust-lld and the musl libc
        # that rustup ships with the target), so no cross toolchain is
        # needed on the build machine.
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl
        working-directory: rust
