[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/parser-als",
    "crates/parser-bw",
    "crates/sync",
    "crates/relay",
    "crates/tui",
    "crates/cli",
]

[[bin]]
name = "clavus"
path = "src/main.rs"

[package]
name = "clavus"
version = "0.1.0"
edition = "2021"
description = "Version control for DAW projects"

[dependencies]
# Clavus crates
clavus-tui = { path = "crates/tui" }
clavus-cli = { path = "crates/cli" }

# CLI & TUI
clap = { version = "4", features = ["derive"] }
ratatui = "0.26"
crossterm = "0.27"

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"
