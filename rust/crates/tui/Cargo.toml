[package]
name = "clavus-tui"
version = "0.1.0"
edition = "2021"
description = "Clavus terminal UI (Ratatui)"

[dependencies]
clavus-core = { path = "../core" }
clavus-parser-als = { path = "../parser-als" }
clavus-parser-bw = { path = "../parser-bw" }
clavus-sync = { path = "../sync" }
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.1"
notify = "6"
dirs = "5"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
