[package]
name = "clavus-relay"
version = "0.1.0"
edition = "2021"
description = "Clavus relay server"

[dependencies]
clavus-core = { path = "../core" }
clavus-sync = { path = "../sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
