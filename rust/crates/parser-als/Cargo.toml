[package]
name = "clavus-parser-als"
version = "0.1.0"
edition = "2021"
description = "Ableton .als parser for Clavus"

[dependencies]
clavus-core = { path = "../core" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.31"
flate2 = "1"
tracing = "0.1"
thiserror = "1"
anyhow = "1"
zip = "2"

[dev-dependencies]
tempfile = "3"
