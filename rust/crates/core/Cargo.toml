[package]
name = "clavus-core"
version = "0.1.0"
edition = "2021"
description = "Clavus core engine — blob store, snapshot, cues, sample audit"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
quick-xml = "0.31"
flume = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tempfile = "3"
flate2 = "1"
zip = "2"
walkdir = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
