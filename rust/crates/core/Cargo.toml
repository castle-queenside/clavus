[package]
name = "clavus-core"
version = "0.1.0"
edition = "2021"
description = "Clavus core engine — blob store, snapshot, cues, sample audit"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
quick-xml = "0.31"
tracing = "0.1"
flate2 = "1"
# Only the deflate compression is needed, and the default features pull
# in zstd, which compiles C and needs a cross-compiler for the musl
# release targets. The Bitwig archive is a plain ZIP.
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"
