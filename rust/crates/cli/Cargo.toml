[package]
name = "clavus-cli"
version = "0.1.0"
edition = "2021"
description = "Clavus command-line interface"

[dependencies]
clavus-core = { path = "../core" }
clavus-parser-als = { path = "../parser-als" }
clavus-parser-bw = { path = "../parser-bw" }
clavus-sync = { path = "../sync" }
clavus-relay = { path = "../relay" }
clavus-tui = { path = "../tui" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "5"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
