[package]
name = "clavus-sync"
version = "0.1.0"
edition = "2021"
description = "Clavus sync client"

[dependencies]
clavus-core = { path = "../core" }
reqwest = { version = "0.11", features = ["json", "stream"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
futures-util = "0.3"
